[mypy]
python_version = 3.13
files = src, tests, scripts
mypy_path = src
# Name modules from their directory (src/mm -> mm, tests/x.py -> tests.x) so the
# [mypy-tests.*] section matches; tests/ has no __init__.py.
explicit_package_bases = True
strict = True

# Tests: annotations optional, the rest of strict still applies.
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
