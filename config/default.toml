# All simulation parameters. Prices are in ticks unless stated.

[instrument]
tick_size = 0.01
initial_price = 100.00          # converted to ticks on load

[simulation]
n_steps = 2000
seed = 0

[market.true_value]
sigma = 1.0                     # std of each step's move, in ticks
step_shape = "normal"           # normal, or student_t: fat tails, scaled to the same std
student_t_df = 5.0              # student_t only; excess kurtosis 6 / (df - 4) = 6

[market.noise]
rate = 1.0                      # mean arrivals per step (Poisson)
size = [1, 5]                   # lots, uniform inclusive
fill_prob_at_2_ticks = 0.30     # sets how price-sensitive they are
tolerance = "exponential"       # shape of their price tolerance: exponential, uniform, lognormal
arrivals = "poisson"            # poisson at rate, or regime: Markov calm/busy rate, same mean rate
calm_rate_scale = 0.5           # regime only: calm rate = 0.5 x rate
calm_duration = 80.0            # regime only: mean calm spell, steps (geometric)
busy_rate_scale = 3.0           # regime only: busy rate = 3 x rate
busy_duration = 20.0            # regime only: busy share 20/(80+20) = 0.2; 0.8x0.5 + 0.2x3 = 1
size_shape = "uniform"          # uniform over size, or lognormal: max(1, round(LogNormal(mu, sigma)))
size_log_mu = 0.5642            # lognormal only: solved by bisection on the exact mean of the
                                # rounded size so it is 3.0 lots, the mean of uniform 1-5
size_log_sigma = 1.0            # lognormal only; p99 / median of the rounded size is about 9

[market.informed]
share = 0.15                    # fraction of all takers
lookahead = 10                  # steps ahead they see the true value
edge_threshold = 1.0            # minimum edge they need, in ticks
size = [5, 10]

[engine]
fee_per_lot = 0                 # ticks per lot

[agent]
type = "skew"                   # which agent runs by default (v1)

[agent.naive]
half_spread = 2                 # ticks
quote_size = 5                  # lots

[agent.skew]
half_spread = 2                 # ticks
quote_size = 5                  # lots
skew_per_lot = 0.05             # ticks of reservation shift per lot, tuned on dev seeds (docs/results/v1-skew)

[agent.kalman]
# estimated on base dev seeds 0–29 by make calibrate; see docs/results/calibration.md
sigma = 1.04                    # true-value volatility, ticks per step
noise_rate = 1.01               # lambda: takers per step who would trade at the centre
mean_size = 3.50                # average fill size, lots
mean_size_sq = 16.44            # average of fill size squared, lots^2
k = 0.38                        # fills at distance d from the centre fall as exp(-k * d)
gain_scale = 1.0                # 1 = the Kalman gain; used only for the sensitivity check

# [agent.kalman_tuned] half_spread and [agent.toxicity] base_half_spread, markout_horizon and
# widen_per_tick from make sweep-toxicity, 2026-11-28 (dev seeds, worst-case Sharpe over
# no_informed/base/toxic; docs/results/v3-toxicity/dev-sweep.md). v3's best has c = 0, so it
# quotes exactly as the control: widening on toxicity did not beat a tuned fixed spread.
[agent.kalman_tuned]            # control for v3: v2 with a tuned half-spread; v1/v2 keep [agent.skew]
half_spread = 4                 # ticks

[agent.toxicity]                # v3: widen both sides when the agent's own fills go against it
base_half_spread = 4            # ticks at zero toxicity
markout_horizon = 5             # tau, observations from a fill's reference fv to its mark
widen_per_tick = 0.0            # c, half-spread ticks per tick of toxicity
ewma_halflife = 50.0            # lots of matured fills; a choice, not tuned (v5 searches it)
max_half_spread = 8             # ticks; a choice, not tuned

[agent.calibration]             # quotes at random distances so make calibrate can fit the fill rate
distances = [1, 5]              # ticks from its centre (v1's skewed centre), uniform per side per step
rng_stream = 1                  # own RNG: PCG64([episode seed, rng_stream]), never the market's

[risk]
position_limit = 50             # lots
max_order_size = 10             # lots
max_quote_distance = 50         # ticks from the last trade

[evaluation]
dev_seeds = [0, 29]             # inclusive range, used for tuning
heldout_seeds = [1000, 1029]    # inclusive range, used only for reported numbers
markout_horizons = [0, 1, 5, 10, 20]
bootstrap_resamples = 10000
bootstrap_seed = 12345

[calibration]
sigma_lag = 50                  # steps between trade prices for sigma; dilutes the bid/ask bounce

[scenarios]                     # each scenario lists only what it changes
no_informed = { "market.informed.share" = 0.0 }
base        = {}
toxic       = { "market.informed.share" = 0.40 }
uniform_takers    = { "market.noise.tolerance" = "uniform" }     # same mean, hard cutoff at 2/k
heavy_tail_takers = { "market.noise.tolerance" = "lognormal" }   # same mean, a few accept bad prices
# Realism stress (decision 08): same mean noise rate, noise size and step std as base; shape only.
bursty_takers    = { "market.noise.arrivals" = "regime" }
heavy_tail_sizes = { "market.noise.size_shape" = "lognormal" }
fat_tail_value   = { "market.true_value.step_shape" = "student_t" }
realistic_mix    = { "market.noise.arrivals" = "regime", "market.noise.size_shape" = "lognormal", "market.true_value.step_shape" = "student_t" }
