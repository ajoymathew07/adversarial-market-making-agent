# All simulation parameters. Prices are in ticks unless stated.

[instrument]
tick_size = 0.01
initial_price = 100.00          # converted to ticks on load

[simulation]
n_steps = 2000
seed = 0

[market.true_value]
sigma = 1.0                     # std of each step's move, in ticks

[market.noise]
rate = 1.0                      # mean arrivals per step (Poisson)
size = [1, 5]                   # lots, uniform inclusive
fill_prob_at_2_ticks = 0.30     # sets how price-sensitive they are

[market.informed]
share = 0.15                    # fraction of all takers
lookahead = 10                  # steps ahead they see the true value
edge_threshold = 1.0            # minimum edge they need, in ticks
size = [5, 10]

[engine]
fee_per_lot = 0                 # ticks per lot

[agent]
type = "skew"                   # which agent runs by default (v1)

[agent.naive]
half_spread = 2                 # ticks
quote_size = 5                  # lots

[agent.skew]
half_spread = 2                 # ticks
quote_size = 5                  # lots
gamma = 0.005                   # risk aversion, chosen on dev seeds (docs/results/v1-skew)
sigma = 1.0                     # agent's assumed volatility, ticks per step
horizon = 10                    # steps over which inventory risk is counted (tau)

[risk]
position_limit = 50             # lots
max_order_size = 10             # lots
max_quote_distance = 50         # ticks from the last trade

[evaluation]
dev_seeds = [0, 29]             # inclusive range, used for tuning
heldout_seeds = [1000, 1029]    # inclusive range, used only for reported numbers
markout_horizons = [0, 1, 5, 10, 20]
bootstrap_resamples = 10000
bootstrap_seed = 12345

[scenarios]                     # each scenario lists only what it changes
no_informed = { "market.informed.share" = 0.0 }
base        = {}
toxic       = { "market.informed.share" = 0.40 }
