# All simulation parameters. Prices are in ticks unless stated.

[instrument]
tick_size = 0.01
initial_price = 100.00          # converted to ticks on load

[simulation]
n_steps = 2000
seed = 0

[market.true_value]
sigma = 1.0                     # std of each step's move, in ticks

[market.noise]
rate = 1.0                      # mean arrivals per step (Poisson)
size = [1, 5]                   # lots, uniform inclusive
fill_prob_at_2_ticks = 0.30     # sets how price-sensitive they are

[market.informed]
share = 0.15                    # fraction of all takers
lookahead = 10                  # steps ahead they see the true value
edge_threshold = 1.0            # minimum edge they need, in ticks
size = [5, 10]

[engine]
fee_per_lot = 0                 # ticks per lot

[agent]
type = "skew"                   # which agent runs by default (v1)

[agent.naive]
half_spread = 2                 # ticks
quote_size = 5                  # lots

[agent.skew]
half_spread = 2                 # ticks
quote_size = 5                  # lots
skew_per_lot = 0.05             # ticks of reservation shift per lot, tuned on dev seeds (docs/results/v1-skew)

[agent.kalman]
# estimated on base dev seeds 0–29 by make calibrate; see docs/results/calibration.md
sigma = 1.04                    # true-value volatility, ticks per step
noise_rate = 1.01               # lambda: takers per step who would trade at the centre
mean_size = 3.50                # average fill size, lots
mean_size_sq = 16.44            # average of fill size squared, lots^2
k = 0.38                        # fills at distance d from the centre fall as exp(-k * d)
gain_scale = 1.0                # 1 = the Kalman gain; used only for the sensitivity check

[agent.calibration]             # quotes at random distances so make calibrate can fit the fill rate
distances = [1, 5]              # ticks from its centre (v1's skewed centre), uniform per side per step
rng_stream = 1                  # own RNG: PCG64([episode seed, rng_stream]), never the market's

[risk]
position_limit = 50             # lots
max_order_size = 10             # lots
max_quote_distance = 50         # ticks from the last trade

[evaluation]
dev_seeds = [0, 29]             # inclusive range, used for tuning
heldout_seeds = [1000, 1029]    # inclusive range, used only for reported numbers
markout_horizons = [0, 1, 5, 10, 20]
bootstrap_resamples = 10000
bootstrap_seed = 12345

[calibration]
sigma_lag = 50                  # steps between trade prices for sigma; dilutes the bid/ask bounce

[scenarios]                     # each scenario lists only what it changes
no_informed = { "market.informed.share" = 0.0 }
base        = {}
toxic       = { "market.informed.share" = 0.40 }
